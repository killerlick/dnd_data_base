services:

  postgres:
    build: ./postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dnd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dnd"]
      interval: 5s
      timeout: 5s
      retries: 10

  python:
    build: ./python
    depends_on:
      postgres:
       condition: service_healthy
